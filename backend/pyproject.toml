[project]
name = "prelegal-backend"
version = "0.1.0"
description = "Prelegal V1 foundation - FastAPI backend that serves the statically built frontend and a fake-login auth API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "bcrypt>=4.2",
    "itsdangerous>=2.2",
    "litellm>=1.100.0",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.uv]
package = false
